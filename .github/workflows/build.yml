
name: Build Auto Rename Folder APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o AutoRenameFolder-project-v2-fixed.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoRenameFolder-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRenameFolder-APK
          path: AutoRenameFolder-debug.apk
          if-no-files-found: error
          retention-days: 14

